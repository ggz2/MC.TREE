<!DOCTYPE html>
<html>
<head>
    <title>EaglerCraft Tree</title>
    <style>
        /* Style the iframe to fill width and 90% height */
        #myIframe {
            display: none;
            width: 100%;
            height: 90%;
            border: none; /* Optional: remove border */
        }
        /* Set body height to fill viewport for proper sizing */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Style the form */
        #myForm {
            padding: 10px;
            background-color: #f0f0f0;
        }
        /* Make sure the iframe container fills remaining space */
        #iframeContainer {
            flex: 1;
            display: flex;
            background-image: url('Productions.png');
              background-size: cover; /* or contain, depending on effect */
              background-position: center;
              background-repeat: no-repeat;
        }
    </style>
</head>
<body>

<!-- Form with dropdown menu -->
<form id="myForm">
    <label for="dropdown">Choose an option:</label>
    <select id="dropdown" name="option" required>
        <option value="">Choose Version</option>
        <option value="Indev">Indev</option>
        <option value="1.2.5">Beta 1.2.5</option>
        <option value="1.2.6">Beta 1.2.6</option>
        <option value="1.3">Beta 1.3</option>
        <option value="1.7.3">Beta 1.7.3</option>
        <option value="1.8"> 1.8</option>
        <option value="1.9.4">1.9.4</option>
        <option value="DragonX">DragonX</option>
        <!-- Add more options as needed -->
    </select>
    <button type="submit">Load Iframe</button>
</form>

<!-- Container for iframe to fill remaining space -->
<div id="iframeContainer">
    <iframe id="myIframe"></iframe>
</div>

<script>
    // Set the base URL to your specified address
    var baseUrl = "https://ggz2.github.io/MC.TREE/";

    // Get references
    var form = document.getElementById("myForm");
    var iframe = document.getElementById("myIframe");
    var dropdown = document.getElementById("dropdown");

    // Handle form submission
    form.addEventListener("submit", function(event) {
        event.preventDefault(); // Prevent form from submitting normally

        // Get selected value
        var selectedValue = dropdown.value.trim();

        if (selectedValue) {
            // Construct URL with .html appended
            var fullUrl = baseUrl + encodeURIComponent(selectedValue) + ".html";

            // Set iframe src
            iframe.src = fullUrl;

            // Show iframe
            iframe.style.display = "block";
        }
    });
    console.log("Updated May 31st 2025")
</script>
    

</body>
</html>
