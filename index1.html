<!DOCTYPE html>
<html>
<head>
  <title>MC.TREE Menu</title>
  <!-- Minecraft font from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Coral+Pixels&display=swap" rel="stylesheet">
  <style>
    html {
      height: 100%;
      width: 100%;
    }

    body {
      margin: 0;
      height: 100%;
      width: 100%;
      font-family: 'Minecraft', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Static background image */
      background-image: url('background.webp'); /* replace with your image URL */
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed; /* Keeps background static when scrolling */
    }

    /* Container for buttons, arranged outward */
    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 30px;
      padding: 40px;
      background-color: rgba(16, 64, 6, 0.7); /* semi-transparent overlay for readability */
      border-radius: 15px;
      max-width: 1200px;
      width: 90%;
    }

    /* Style for each button */
    a.button {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      font-size: 50px;
      text-decoration: none;
      color: white;
      font-family: 'Minecraft', sans-serif;
      background-image: url('button.webp'); /* replace with your button background image */
      background-size: cover;
      background-position: center;
      border: 4px solid white;
      border-radius: 15px;
      /* Removed shadow for a cleaner look */
      /* Removed hover scaling to keep size constant */
      transition: none; /* no transition for size or shadow */
    }

    /* Removed hover effects to keep buttons static and without shadow effects */

    /* Optional: Add a glow or text shadow for better readability */
    a.button span {
      text-shadow: 2px 2px 4px #000;
    }

    /* Responsive adjustments */
    @media(max-width: 768px) {
      a.button {
        font-size: 30px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="menu">
    <a class="button" href="Indev.html"><span>Run Indev</span></a>
    <a class="button" href="1.2.5.html"><span>Beta 1.2.5</span></a>
    <a class="button" href="1.2.6.html"><span>Beta 1.2.6</span></a>
    <a class="button" href="1.3.html"><span>Beta 1.3</span></a>
    <a class="button" href="1.7.3.html"><span>Beta 1.7.3</span></a>
    <a class="button" href="1.5.2.html"><span>1.5.2</span></a>
    <a class="button" href="1.8.html"><span>1.8</span></a>
    <a class="button" href="1.9.4.html"><span>1.9.4</span></a>
    <a class="button" href="DragonX.html"><span>DragonX</span></a>
    <a class="button" href="WurstX.html"><span>WurstX</span></a>
    <a class="button" href="tuff1.12.2.html"><span>Tuff 1.12.2</span></a>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
